<div class="tv-player-bar" id="playerBar" data-dpad-row>
    <button type="button" class="tv-player-btn" id="playerPlayBtn" aria-label="Play">
        <svg class="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5z"/></svg>
        <svg class="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>
    </button>
    <button type="button" class="player-seek-btn" id="playerSeekBack" data-seek="-10" aria-label="Rewind 10 seconds">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M11 19l-7-7 7-7M18 19l-7-7 7-7"/></svg>
        <span class="player-seek-btn-label mono">10s</span>
    </button>
    <button type="button" class="player-seek-btn" id="playerSeekForward" data-seek="10" aria-label="Forward 10 seconds">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 5l7 7-7 7M13 5l7 7-7 7"/></svg>
        <span class="player-seek-btn-label mono">10s</span>
    </button>
    <div class="tv-player-progress-wrap" aria-hidden="true">
        <div class="tv-player-progress-track">
            <div class="tv-player-progress-buffer" id="playerBuffer"></div>
            <div class="tv-player-progress-fill" id="playerProgress"></div>
        </div>
    </div>
    <span class="tv-player-time mono" id="playerTimeCurrent">0:00</span>
    <span class="tv-player-time-sep">/</span>
    <span class="tv-player-time mono" id="playerTimeDuration">0:00</span>
    <button type="button" class="tv-player-btn tv-player-fullscreen-btn" id="playerFullscreenBtn" aria-label="Fullscreen">
        <svg class="icon-enter-fs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H3v5M16 3h5v5M16 21h5v-5M8 21H3v-5"/></svg>
        <svg class="icon-exit-fs" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
</div>
